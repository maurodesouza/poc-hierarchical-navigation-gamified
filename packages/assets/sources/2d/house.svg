<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- House interior overview — warm afternoon light, colors from docs/palette.json -->

  <!-- Background -->
  <rect width="800" height="600" fill="#FFF3E2" />

  <!-- Isometric house cutaway -->
  <g transform="translate(400, 300)">
    <!-- Wood plank floor -->
    <polygon points="-200,100 0,200 200,100 0,0" fill="#D19A62" />
    <g stroke="#B07A48" stroke-width="2">
      <line x1="-150" y1="75" x2="50" y2="175" />
      <line x1="-100" y1="50" x2="100" y2="150" />
      <line x1="-50" y1="25" x2="150" y2="125" />
    </g>

    <!-- Walls: left lit, right shaded -->
    <polygon points="-200,100 -200,-100 0,-200 0,0" fill="#F9E6C8" />
    <polygon points="0,0 0,-200 200,-100 200,100" fill="#EACDA3" />

    <!-- Window on left wall -->
    <polygon points="-166,-15 -98,-49 -98,-123 -166,-89" fill="#FFF3E2" />
    <polygon points="-160,-22 -104,-50 -104,-116 -160,-88" fill="#C4E8E4" />
    <line x1="-132" y1="-36" x2="-132" y2="-102" stroke="#FFF3E2" stroke-width="4" />
    <line x1="-160" y1="-55" x2="-104" y2="-83" stroke="#FFF3E2" stroke-width="4" />

    <!-- Butter light pool from the window -->
    <polygon points="-96,26 -20,64 30,39 -46,1" fill="#FFD98C" opacity="0.5" />

    <!-- Rug -->
    <ellipse cx="-70" cy="105" rx="105" ry="45" fill="#FFB37E" />
    <ellipse cx="-70" cy="105" rx="82" ry="34" fill="none" stroke="#FFF3E2" stroke-width="4" opacity="0.7" />

    <!-- Sofa (chunky rounded arms, fat cushions) -->
    <g transform="translate(-110, 45)">
      <ellipse cx="-25" cy="46" rx="72" ry="16" fill="#5B4A54" opacity="0.18" />
      <!-- Rear arm -->
      <polygon points="0,-2 40,18 40,-16 0,-36" fill="#FF8A5C" stroke="#FF8A5C" stroke-width="10" stroke-linejoin="round" />
      <!-- Backrest -->
      <polygon points="-80,-26 -68,-20 -68,24 -80,18" fill="#FFB37E" stroke="#FFB37E" stroke-width="8" stroke-linejoin="round" />
      <polygon points="0,-66 12,-60 -28,-40 -40,-46" fill="#F7A8A0" stroke="#F7A8A0" stroke-width="8" stroke-linejoin="round" />
      <polygon points="12,-60 -68,-20 -68,24 12,-16" fill="#FF8A5C" stroke="#FF8A5C" stroke-width="8" stroke-linejoin="round" />
      <!-- Seat -->
      <polygon points="-80,40 -40,60 -40,38 -80,18" fill="#FFB37E" />
      <polygon points="40,20 -40,60 -40,38 40,-2" fill="#FF8A5C" />
      <polygon points="0,-22 40,-2 -40,38 -80,18" fill="#F7A8A0" />
      <!-- Fat cushions -->
      <ellipse cx="-45" cy="6" rx="21" ry="12" fill="#FFB37E" />
      <ellipse cx="-13" cy="-8" rx="21" ry="12" fill="#FFB37E" />
      <!-- Front arm -->
      <polygon points="-84,36 -40,58 -40,16 -84,-6" fill="#FFB37E" stroke="#FFB37E" stroke-width="10" stroke-linejoin="round" />
    </g>

    <!-- Low round coffee table -->
    <g transform="translate(-20, 125)">
      <ellipse cx="0" cy="8" rx="40" ry="11" fill="#5B4A54" opacity="0.18" />
      <rect x="-7" y="-18" width="14" height="24" rx="4" fill="#82552F" />
      <ellipse cx="0" cy="-15" rx="36" ry="18" fill="#B07A48" />
      <ellipse cx="0" cy="-20" rx="36" ry="18" fill="#D19A62" />
      <circle cx="-10" cy="-24" r="4.5" fill="#F7A8A0" />
    </g>

    <!-- Potted plant -->
    <g transform="translate(-170, 85)">
      <ellipse cx="0" cy="18" rx="18" ry="6" fill="#5B4A54" opacity="0.18" />
      <circle cx="7" cy="-22" r="15" fill="#3E7F49" />
      <circle cx="-6" cy="-30" r="14" fill="#58A45C" />
      <circle cx="4" cy="-38" r="11" fill="#58A45C" />
      <polygon points="-13,-2 13,-2 9,16 -9,16" fill="#D96A45" />
      <rect x="-14" y="-6" width="28" height="7" rx="3" fill="#FF8A5C" />
    </g>

    <!-- Doorway to the kitchen (warm light spilling out) -->
    <polygon points="16,8 56,28 56,-76 16,-96" fill="#B07A48" />
    <polygon points="22,11 50,25 50,-70 22,-84" fill="#FFD98C" />

    <!-- Kitchen preview area -->
    <g transform="translate(120, 50)">
      <!-- Checkered tile floor -->
      <polygon points="-80,40 0,80 80,40 0,0" fill="#F4DFB8" />
      <g fill="#FFF3E2">
        <polygon points="0,10 20,20 0,30 -20,20" />
        <polygon points="40,30 60,40 40,50 20,40" />
        <polygon points="-40,30 -20,40 -40,50 -60,40" />
        <polygon points="0,50 20,60 0,70 -20,60" />
      </g>

      <!-- Kitchen walls -->
      <polygon points="-80,40 -80,-60 0,-100 0,0" fill="#F9E6C8" />
      <polygon points="0,0 0,-100 80,-60 80,40" fill="#EACDA3" />

      <!-- Counter preview -->
      <polygon points="-72,2 -24,-22 -6,-13 -54,11" fill="#D19A62" />
      <polygon points="-54,11 -6,-13 -6,21 -54,45" fill="#FFF3E2" />
      <polygon points="-24,-22 -6,-13 -6,21 -24,12" fill="#EACDA3" />
      <circle cx="-38" cy="26" r="2.5" fill="#82552F" />
      <circle cx="-18" cy="16" r="2.5" fill="#82552F" />

      <!-- Sliver of the mint refrigerator -->
      <ellipse cx="42" cy="16" rx="22" ry="7" fill="#5B4A54" opacity="0.18" />
      <polygon points="24,6 48,18 48,-60 24,-72" fill="#BFE6D8" />
      <polygon points="48,18 60,12 60,-66 48,-60" fill="#8FC4AF" />
      <polygon points="24,-72 48,-60 60,-66 36,-78" fill="#C4E8E4" />
      <rect x="28" y="-46" width="4" height="26" rx="2" fill="#C9C2B8" />
    </g>
  </g>
</svg>
