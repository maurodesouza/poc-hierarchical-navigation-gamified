<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- This file contains invisible hotspots for the kitchen scene -->
  <!-- Hotspots are positioned over the refrigerator and other interactive areas -->
  
  <defs>
    <style>
      .hotspot {
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .hotspot:hover {
        filter: drop-shadow(0 0 8px rgba(255, 194, 77, 0.8));
      }
      .hotspot-rect {
        fill: transparent;
        stroke: transparent;
        stroke-width: 2;
        transition: all 0.3s ease;
      }
      .hotspot:hover .hotspot-rect {
        stroke: #FFC24D;
        stroke-opacity: 0.8;
        fill: rgba(255, 194, 77, 0.12);
      }
      .hotspot-indicator {
        transition: all 0.3s ease;
      }
      .hotspot:hover .hotspot-indicator {
        fill: rgba(255, 194, 77, 0.3);
        stroke-opacity: 1;
        r: 10;
      }
    </style>
  </defs>

  <!-- Refrigerator hotspot (main interactive object) -->
  <!-- Positioned over the redrawn mint fridge in the kitchen illustration -->
  <g class="hotspot" data-object-id="refrigerator">
    <rect 
      x="454" 
      y="198" 
      width="132" 
      height="238" 
      class="hotspot-rect"
      rx="4"
    />
    <!-- Add a subtle indicator that this is an object hotspot -->
    <circle 
      cx="520" 
      cy="320" 
      r="8" 
      fill="transparent" 
      stroke="#FFC24D" 
      stroke-width="2" 
      opacity="0.5"
      class="hotspot-indicator"
    />
  </g>
</svg>
