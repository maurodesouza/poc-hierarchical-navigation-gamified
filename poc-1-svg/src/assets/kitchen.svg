<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Kitchen — brightest, warmest room; colors from docs/palette.json -->

  <!-- Background -->
  <rect width="800" height="600" fill="#FFF3E2" />

  <!-- Isometric kitchen room (2:1) -->
  <g transform="translate(400, 280)">
    <!-- Checkered tile floor -->
    <polygon points="0,0 250,125 0,250 -250,125" fill="#F4DFB8" />
    <g fill="#FFF3E2">
      <polygon points="0,0 62.5,31.25 0,62.5 -62.5,31.25" />
      <polygon points="-125,62.5 -62.5,93.75 -125,125 -187.5,93.75" />
      <polygon points="0,62.5 62.5,93.75 0,125 -62.5,93.75" />
      <polygon points="-125,125 -62.5,156.25 -125,187.5 -187.5,156.25" />
      <polygon points="125,62.5 187.5,93.75 125,125 62.5,93.75" />
      <polygon points="0,125 62.5,156.25 0,187.5 -62.5,156.25" />
      <polygon points="125,125 187.5,156.25 125,187.5 62.5,156.25" />
      <polygon points="0,187.5 62.5,218.75 0,250 -62.5,218.75" />
    </g>

    <!-- Walls: back-left lit, back-right shaded -->
    <polygon points="-250,125 -250,-155 0,-280 0,0" fill="#F9E6C8" />
    <polygon points="0,0 0,-280 250,-155 250,125" fill="#EACDA3" />

    <!-- Warm light pool on the floor -->
    <ellipse cx="-60" cy="170" rx="110" ry="40" fill="#FFD98C" opacity="0.4" />

    <!-- Upper cabinets (cream doors, wood knobs) -->
    <g>
      <polygon points="-210,-50 -100,-105 -78,-94 -188,-39" fill="#FFF3E2" />
      <polygon points="-188,21 -78,-34 -78,-94 -188,-39" fill="#FFF3E2" />
      <polygon points="-78,-34 -100,-45 -100,-105 -78,-94" fill="#EACDA3" />
      <line x1="-133" y1="-6.5" x2="-133" y2="-66.5" stroke="#EACDA3" stroke-width="2" />
      <circle cx="-141" cy="-33" r="3.5" fill="#82552F" />
      <circle cx="-125" cy="-41" r="3.5" fill="#82552F" />
    </g>

    <!-- Counter with sink along the back-left wall -->
    <g>
      <ellipse cx="-95" cy="95" rx="95" ry="16" fill="#5B4A54" opacity="0.18" />
      <polygon points="-212,44 -62,-31 -18,-9 -168,66" fill="#D19A62" />
      <polygon points="-168,66 -18,-9 -18,53 -168,128" fill="#FFF3E2" />
      <polygon points="-62,-31 -18,-9 -18,53 -62,31" fill="#EACDA3" />
      <!-- Cabinet doors -->
      <line x1="-118" y1="41" x2="-118" y2="103" stroke="#EACDA3" stroke-width="2" />
      <line x1="-68" y1="16" x2="-68" y2="78" stroke="#EACDA3" stroke-width="2" />
      <circle cx="-128" cy="60" r="4" fill="#82552F" />
      <circle cx="-108" cy="50" r="4" fill="#82552F" />
      <circle cx="-58" cy="25" r="4" fill="#82552F" />
      <!-- Sink basin -->
      <polygon points="-176,40 -136,20 -114,31 -154,51" fill="#948B7F" />
      <polygon points="-170,39 -138,23 -122,31 -154,47" fill="#C9C2B8" />
      <!-- Exaggerated curved faucet -->
      <ellipse cx="-138" cy="19" rx="6" ry="3.5" fill="#948B7F" />
      <path d="M -138 19 C -138 -8 -114 -8 -114 7" fill="none" stroke="#C9C2B8" stroke-width="7" stroke-linecap="round" />
      <!-- Fruit bowl prop -->
      <circle cx="-77" cy="-6" r="5.5" fill="#FF8A5C" />
      <circle cx="-66" cy="-8" r="5.5" fill="#FFD98C" />
      <circle cx="-57" cy="-4" r="4.5" fill="#58A45C" />
      <ellipse cx="-68" cy="0" rx="17" ry="8.5" fill="#F7A8A0" />
    </g>

    <!-- Stove (chunky coral knobs, round burners) -->
    <g>
      <ellipse cx="10" cy="60" rx="55" ry="13" fill="#5B4A54" opacity="0.18" />
      <polygon points="-60,-36 -10,-61 34,-39 -16,-14" fill="#C9C2B8" />
      <polygon points="-16,-14 34,-39 34,27 -16,52" fill="#FFF3E2" />
      <polygon points="-60,30 -16,52 -16,-14 -60,-36" fill="#EACDA3" />
      <!-- Burners -->
      <ellipse cx="-30" cy="-38" rx="12" ry="6" fill="#5B4A54" />
      <ellipse cx="2" cy="-44" rx="12" ry="6" fill="#5B4A54" />
      <!-- Oven door with window and handle -->
      <polygon points="-10,-4 28,-23 28,11 -10,30" fill="#C9C2B8" />
      <polygon points="-5,1 23,-13 23,3 -5,17" fill="#C4E8E4" />
      <line x1="-10" y1="-9" x2="28" y2="-28" stroke="#948B7F" stroke-width="5" stroke-linecap="round" />
      <!-- Chunky knobs -->
      <g>
        <circle cx="-8" cy="-13" r="5.5" fill="#FF8A5C" />
        <circle cx="6" cy="-20" r="5.5" fill="#FF8A5C" />
        <circle cx="20" cy="-27" r="5.5" fill="#FF8A5C" />
        <circle cx="-8" cy="-13" r="1.5" fill="#5B4A54" />
        <circle cx="6" cy="-20" r="1.5" fill="#5B4A54" />
        <circle cx="20" cy="-27" r="1.5" fill="#5B4A54" />
      </g>
    </g>

    <!-- Refrigerator — the hero object (rounded chunky mint body, oversized handles) -->
    <g transform="translate(120, 60)">
      <ellipse cx="0" cy="80" rx="76" ry="19" fill="#5B4A54" opacity="0.18" />
      <!-- Body faces (rounded chunky silhouette via round joins) -->
      <polygon points="-56,-104 0,-76 56,-104 0,-132" fill="#C4E8E4" stroke="#C4E8E4" stroke-width="10" stroke-linejoin="round" />
      <polygon points="0,84 56,56 56,-104 0,-76" fill="#8FC4AF" stroke="#8FC4AF" stroke-width="10" stroke-linejoin="round" />
      <polygon points="-56,56 0,84 0,-76 -56,-104" fill="#BFE6D8" stroke="#BFE6D8" stroke-width="10" stroke-linejoin="round" />
      <!-- Freezer/fridge gasket split -->
      <polyline points="-59,-46 0,-17 59,-46" fill="none" stroke="#FFF3E2" stroke-width="5" stroke-linecap="round" />
      <!-- Oversized handles -->
      <rect x="-14" y="-68" width="10" height="34" rx="5" fill="#948B7F" />
      <rect x="-16" y="-70" width="10" height="34" rx="5" fill="#C9C2B8" />
      <rect x="-14" y="-4" width="10" height="66" rx="5" fill="#948B7F" />
      <rect x="-16" y="-6" width="10" height="66" rx="5" fill="#C9C2B8" />
    </g>
  </g>
</svg>
