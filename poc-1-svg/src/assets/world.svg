<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Golden-hour exterior — all colors from docs/palette.json -->

  <!-- Sky -->
  <rect width="800" height="600" fill="#AEDCEC" />

  <!-- Sun (key light from the upper-left) -->
  <circle cx="120" cy="92" r="44" fill="#FFD98C" />
  <circle cx="120" cy="92" r="30" fill="#FFF3E2" />

  <!-- Clouds -->
  <g fill="#FFF3E2">
    <ellipse cx="310" cy="88" rx="48" ry="16" />
    <ellipse cx="345" cy="74" rx="30" ry="13" />
    <ellipse cx="600" cy="128" rx="54" ry="17" />
    <ellipse cx="640" cy="114" rx="32" ry="12" />
  </g>

  <!-- Isometric ground plane (2:1 diamond, top light / sides darker) -->
  <polygon points="400,270 720,430 400,590 80,430" fill="#A5D96E" />
  <polygon points="80,430 400,590 400,612 80,452" fill="#75B04E" />
  <polygon points="400,590 720,430 720,452 400,612" fill="#3E7F49" />

  <!-- Winding path from the scene edge to the door -->
  <path d="M 376 461 L 424 461 C 446 486 408 498 430 522 C 450 545 402 552 420 578 L 366 578 C 350 552 396 545 378 522 C 360 500 396 490 376 461 Z" fill="#F4DFB8" />

  <!-- Isometric house (chunky toy silhouette, oversized roof/door/windows) -->
  <g transform="translate(400, 380)">
    <!-- Contact shadow -->
    <ellipse cx="20" cy="84" rx="125" ry="26" fill="#5B4A54" opacity="0.18" />

    <!-- Walls: front lightest, right side shaded -->
    <polygon points="-60,0 60,0 60,80 -60,80" fill="#FFF3E2" />
    <polygon points="60,0 100,-20 100,60 60,80" fill="#EACDA3" />
    <polygon points="-60,0 -20,-20 100,-20 60,0" fill="#F9E6C8" />

    <!-- Oversized roof (~45% of house height) with overhang -->
    <polygon points="-72,6 0,-62 40,-82 -32,-14" fill="#FFB37E" />
    <polygon points="0,-62 72,6 112,-14 40,-82" fill="#D96A45" />
    <polygon points="-72,6 72,6 0,-62" fill="#FF8A5C" />

    <!-- Oversized door with round knob -->
    <rect x="-25" y="16" width="50" height="64" rx="10" fill="#FF8A5C" />
    <rect x="-17" y="24" width="34" height="48" rx="6" fill="#D96A45" />
    <circle cx="14" cy="52" r="5" fill="#FFD98C" />

    <!-- Oversized windows with chunky cream frames -->
    <g>
      <rect x="-54" y="16" width="26" height="30" rx="5" fill="#FFF3E2" />
      <rect x="-50" y="20" width="18" height="22" rx="3" fill="#C4E8E4" />
      <line x1="-41" y1="20" x2="-41" y2="42" stroke="#FFF3E2" stroke-width="2" />
      <line x1="-50" y1="31" x2="-32" y2="31" stroke="#FFF3E2" stroke-width="2" />
    </g>
    <g>
      <rect x="28" y="16" width="26" height="30" rx="5" fill="#FFF3E2" />
      <rect x="32" y="20" width="18" height="22" rx="3" fill="#C4E8E4" />
      <line x1="41" y1="20" x2="41" y2="42" stroke="#FFF3E2" stroke-width="2" />
      <line x1="32" y1="31" x2="50" y2="31" stroke="#FFF3E2" stroke-width="2" />
    </g>
  </g>

  <!-- Tree 1 (lollipop proportions) -->
  <g transform="translate(240, 480)">
    <ellipse cx="0" cy="6" rx="36" ry="11" fill="#5B4A54" opacity="0.18" />
    <rect x="-8" y="-32" width="16" height="38" rx="5" fill="#82552F" />
    <circle cx="9" cy="-58" r="38" fill="#3E7F49" />
    <circle cx="-5" cy="-66" r="36" fill="#58A45C" />
  </g>

  <!-- Tree 2 -->
  <g transform="translate(585, 468) scale(0.85)">
    <ellipse cx="0" cy="6" rx="36" ry="11" fill="#5B4A54" opacity="0.18" />
    <rect x="-8" y="-32" width="16" height="38" rx="5" fill="#82552F" />
    <circle cx="9" cy="-58" r="38" fill="#3E7F49" />
    <circle cx="-5" cy="-66" r="36" fill="#58A45C" />
  </g>

  <!-- Mailbox by the path -->
  <g transform="translate(322, 502)">
    <ellipse cx="0" cy="5" rx="17" ry="6" fill="#5B4A54" opacity="0.18" />
    <rect x="-3" y="-32" width="6" height="37" rx="2" fill="#82552F" />
    <rect x="-15" y="-48" width="30" height="18" rx="8" fill="#FF8A5C" />
    <rect x="10" y="-60" width="4" height="14" rx="2" fill="#FFD98C" />
  </g>

  <!-- Bushes -->
  <ellipse cx="470" cy="508" rx="26" ry="13" fill="#3E7F49" />
  <ellipse cx="462" cy="502" rx="20" ry="11" fill="#58A45C" />
  <ellipse cx="298" cy="440" rx="20" ry="10" fill="#3E7F49" />
  <ellipse cx="292" cy="435" rx="15" ry="9" fill="#58A45C" />
</svg>
